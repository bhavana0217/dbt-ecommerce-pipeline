name: 'ecommerce_analytics'
version: '1.0.0'
config-version: 2

# This project uses the same profile name as the file profiles.yml at the repo root.
profile: 'ecommerce_analytics'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
snapshot-paths: ["snapshots"]
target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

# Raw extracts land in their own schema so nobody mistakes them for trusted data.
# unit_price_raw is forced to varchar: most values look numeric ("430.01") but
# ~15% arrive as "$1,299.99", and DuckDB's type sniffer would otherwise guess
# DOUBLE and crash on the symbols. Cleaning happens in stg_products.
seeds:
  ecommerce_analytics:
    +schema: raw
    raw_products:
      +column_types:
        unit_price_raw: varchar

snapshots:
  +schema: snapshots

models:
  ecommerce_analytics:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
